[package]
name = "train-me"
version = "0.5.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "train_me_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Android-aware filesystem access. Needed so package imports can read
# the `content://` URIs returned by the Android file picker — those are
# not real filesystem paths and can't be opened with `std::fs`.
tauri-plugin-fs = "2"
tauri-plugin-android-fs = "28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ort = { version = "2.0.0-rc.11", features = ["download-binaries", "ndarray", "xnnpack"] }

# Array processing (like NumPy)
ndarray = { version = "0.17.2", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"

# Parallel processing
rayon = "1.10"

# Audio processing
hound = "3.5"
rustfft = "6.2"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Unicode normalization
unicode-normalization = "0.1"

# Regular expressions
regex = "1.10"

# System calls
libc = "0.2"
jni = "0.21"
android_logger = "0.13"
log = "0.4"
once_cell = "1.19"

# HTTP client for model downloads
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# XML parsing for TTS tags
quick-xml = "0.37"

# Date/time for track naming
chrono = { version = "0.4", features = ["serde"] }

# Singleton state management
parking_lot = "0.12"

# SQLite for inventory/activity logs
rusqlite = { version = "0.31", features = ["bundled"] }

# RFC-4180 CSV (de)serialization for the inventory im/export. Pure Rust, so
# it builds unchanged for the Android target.
csv = "1"

# Force aegis (a transitive dep of bashkit's `sqlite` → turso_core) to use
# its pure-Rust backend. aegis's build script otherwise compiles C with
# `cc::Build::prefer_clang_cl_over_msvc(true)`, which picks up the Android
# NDK `clang-cl` found on PATH in this dev environment and fails on
# `<errno.h>`. The `pure-rust` feature switches to a Rust AES backend
# (still AES-NI accelerated on x86_64) and skips the C build entirely.
aegis = { version = "0.9", features = ["pure-rust"] }

# Bash sandbox for the agent. The `sqlite` feature enables the embedded
# Turso-backed `sqlite`/`sqlite3` builtin so the agent can query databases
# inside its sandbox directly.
bashkit = { version = "0.9", features = ["realfs", "sqlite"] }

# Async runtime required by bashkit
tokio = { version = "1", features = ["full"] }

# ZIP archive support for package imports
zip = "2"

# Content hashing for manifest staleness checks
sha2 = "0.10"

# Temp directory for extracting imported packages
tempfile = "3"
tauri-plugin-notification = "2.3.3"
cron = "0.16.0"

# In-process localhost HTTP server for serving rendered audio to the WebView.
# On Android, Tauri's built-in `asset://` protocol routes through the WebView's
# `shouldInterceptRequest`, which Android's media player mishandles for
# streamed media — playback cuts off after ~10s with MEDIA_ERR_NETWORK (code 2).
# A real loopback TCP socket is fetched as a normal connection by the media
# player, so streaming works. `tower-http`'s `ServeDir` implements full
# Range / 206 / HEAD / MIME natively, so no manual Range handling is needed.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Desktop-only `env_logger` backend for the `log` facade (see `init_logger` in
# lib.rs). On Android we use `android_logger` instead, so this is gated to
# non-Android targets to keep it out of the mobile build.
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

# Local override: `turso_ext` (pulled in transitively via
# bashkit[sqlite] → turso_core → turso_ext) ships a build script that uses
# `cfg!(target_os = "windows")`, which inside a build script is evaluated
# against the *host* platform, not the *target*. Cross-compiling from Windows
# to Android therefore emits `cargo:rustc-link-lib=advapi32` and the Android
# linker fails with "unable to find library -ladvapi32". The vendored copy in
# `vendor/turso_ext` is the same source with that one build-script bug fixed.
[patch.crates-io]
turso_ext = { path = "vendor/turso_ext" }
