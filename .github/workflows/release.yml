name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Derive the release tag from package.json's `version` and short-circuit
  # when a release for that version already exists. This is what makes the
  # release "automatic": every push to master produces a draft release tagged
  # `v<version>` (e.g. v0.8.2) without anyone cutting a tag by hand. Bump the
  # version in package.json (+ src-tauri/tauri.conf.json) to cut a new release.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      skip: ${{ steps.derive.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag from package.json
        id: derive
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' package.json)
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — nothing new to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build Windows MSI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: "train-me ${{ needs.meta.outputs.tag }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: "--bundles msi"

  build-android:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Initialize Tauri Android project
        run: bun run tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Patch usesCleartextTraffic
        run: |
          FILE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$FILE"

      - name: Add NDK toolchain to PATH
        run: echo "${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build Android APK
        run: bun run tauri android build -t aarch64 --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          CXX_aarch64_linux_android: aarch64-linux-android21-clang++
          AR_aarch64_linux_android: llvm-ar

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d1 "$ANDROID_HOME/build-tools"/*/ | sort -V | tail -1)
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          echo "Build tools: $BUILD_TOOLS"
          echo "Unsigned APK: $UNSIGNED_APK"
          "${BUILD_TOOLS}zipalign" -f 4 "$UNSIGNED_APK" aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks <(echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d) \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out train-me-${{ needs.meta.outputs.tag }}-arm64-v8a.apk \
            aligned.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: false
          files: train-me-${{ needs.meta.outputs.tag }}-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
